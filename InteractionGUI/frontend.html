<!DOCTYPE html>
<html>
<head>
  <title>InteractionGUI Web</title>
</head>

<!-- simple styling -->
<style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    label {
      font-weight: bold;
    }
    #result {
      margin-left: 10px;
      color: blue;
    }
    .hidden { display: none; } /* CSS class to hide elements */
  </style>




<!-- GUI layout -->
<body>
  <h2>Module Interaction GUI</h2>
  
  <!-- Module Setup Section -->
  <fieldset>
    <legend>Module Setup</legend>
    
    <!-- Radio buttons -->
    <div>
      <label><input type="radio" name="moduleType" value="Live" onclick="toggleOptions()"> Live Module</label>
      <label><input type="radio" name="moduleType" value="Hexa" onclick="toggleOptions()"> Hexaboard</label>
    </div>

    <!-- Live Module options -->
    <fieldset id="liveOptions" class="hidden">
      <legend>Live Module Options</legend>
      <label>Module Index: <input type="text"></label><br>
      <label>ROC Version:
        <select>
          <option>V3b SU02</option>
          <option>V3b SU03</option>
          <option>V3b SU04</option>
        </select>
      </label>
    </fieldset>

    <!-- Hexaboard options -->
    <fieldset id="hexaOptions" class="hidden">
      <legend>Hexaboard Options</legend>
      <label>
        Density:
        <input type="radio" name="density" value="low"> Low
        <input type="radio" name="density" value="high"> High
      </label><br>
      <label>Shape:
        <select>
          <option>Type A</option>
          <option>Type B</option>
          <option>Type C</option>
        </select>
      </label>
    </fieldset>

    <!-- Text inputs -->
    <div>
      <label> Module Index:
        <input type="text" id="moduleIndexInput" placeholder="eg.123">
      </label>
      <button class="btn" onclick="clearInput('moduleIndexInput')">Clear</button>
    </div>

    <div>
      <label> Scan QR Code:
        <input type="text" id="qrInput" placeholder="320 - MM - TT [TT,TN, NN] NNNNNN">
      </label>
      <button class="btn" onclick="clearInput('qrInput')">Clear</button>
    </div>

    <div>
      <label>Module Serial Number:</label>
      <span id="serialDisplay"></span>
    </div>


    <div>
      <label>Trophy Serial No.:
        <input type="text" id="trophyInput">
      </label>
      <button class="btn" onclick="clearInput('trophyInput')">Clear</button>
    </div>

    <!-- Dropdown -->
    <div>
      <label>Inspector:
        <select id="inspector">
          <option value="">-- Select --</option>
          <option value="Alice">Alice</option>
          <option value="Bob">Bob</option>
        </select>
      </label>
    </div>

    <!-- Buttons -->
    <div>
      <button class="btn">Configure Test Stand</button>
      <button class="btn">Only IV Test</button>
    </div>

    <!-- Checkboxes -->
    <div>
      <label><input type="checkbox" id="debug"> Debug Mode</label>
      <label><input type="checkbox" id="skip"> Skip Electrical Checks</label>
    </div>
  </fieldset>








  <!-- add data-action for each button-->
  <button class="action-btn" data-action="run_pedestal_test">Run Pedestal Test</button>
  <button class="action-btn" data-action="shutdown">Close GUI</button>

  <p id="output"></p>

  <script>

    //define functions
    function clearInput(inputId) {
      document.getElementById(inputId).value = "";
    }

    function toggleOptions() {
      const selected = document.querySelector("input[name='moduleType']:checked").value;
      const liveOptions = document.getElementById("liveOptions");
      const hexaOptions = document.getElementById("hexaOptions");

      if (selected === "Live") {
        liveOptions.classList.remove("hidden");
        hexaOptions.classList.add("hidden");
      } else if (selected === "Hexa") {
        hexaOptions.classList.remove("hidden");
        liveOptions.classList.add("hidden");
      }
    }

    // function to call backend APIs
    async function callAPI(action) {
      try {
        const response = await fetch(`http://127.0.0.1:8000/${action}`, {
          method: "POST"
        });
        const data = await response.json();
        document.getElementById("output").textContent =
          `${action} Response: ` + JSON.stringify(data);
      } catch (error) {
        document.getElementById("output").textContent =
          `${action} Error: ` + error;
      }
    }

    
    // relate events to .action-btn
    document.querySelectorAll(".action-btn").forEach(button => {
    button.addEventListener("click", async () => {
      const action = button.getAttribute("data-action");
      const data = await callAPI(action);

      // close window if shutdown
      if (action === "shutdown") {
        window.close();
      }
    });
  });

    // ensure backend shutdown on window close
    window.addEventListener("beforeunload", async (event) => {
    try {
      await fetch("http://127.0.0.1:8000/shutdown", { method: "POST" });
    } catch (err) {
      console.log("Shutdown request failed:", err);
    }
  });
  </script>
</body>
</html>
